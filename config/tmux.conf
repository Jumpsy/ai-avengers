# ===== agent-swarm tmux config =====
# Sourced from your ~/.tmux.conf by the installer. __BINDIR__ is replaced at install time.

set -g mouse on                 # click any pane to focus it; scroll; drag-select to copy
set -g history-limit 50000
set -g default-terminal "tmux-256color"
setw -g aggressive-resize on
set -g escape-time 0
set -g status-interval 5
set -g status-right "#[fg=green]agents  #[fg=yellow]%H:%M"
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "

# ---- Prompt ALL agents at once: prefix + a -> type once -> sent to every agent pane ----
# (routes the typed text through a tmux buffer so quotes/special chars survive intact)
bind a command-prompt -p "all agents:" { set-buffer -b bcast "%%" ; run-shell -b "__BINDIR__/askall --buffer bcast" }

# ---- Raw keystroke broadcast (types your keys into every pane live): prefix+e on, prefix+E off ----
bind e setw synchronize-panes on  \; display "BROADCAST(keys): ON"
bind E setw synchronize-panes off \; display "BROADCAST(keys): OFF"

# ---- Restart every agent fresh ----
bind K run-shell "__BINDIR__/clearall-do #{session_name}"

# ---- Pane navigation: Alt+arrows (no prefix) ----
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---- Shared clipboard / copy to your local machine via OSC52 ----
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
set -g allow-passthrough on
setw -g mode-keys vi
# in copy mode: v = start select, y / Enter = copy (to your local clipboard), Esc = cancel
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
# mouse drag selects + copies to your local clipboard (when the pane's app isn't grabbing the mouse)
bind -T root MouseDrag1Pane if -F '#{mouse_any_flag}' 'send -M' 'copy-mode -M'
# prefix + m = mouse OFF (so you can native-select/copy in apps that grab the mouse), prefix + M = back ON
bind m set -g mouse off \; display "MOUSE OFF — native select/copy, then back on with prefix+M"
bind M set -g mouse on  \; display "MOUSE ON"
